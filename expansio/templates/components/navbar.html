{% load static %}

<header class="w-full sticky top-0 z-40 bg-cream-100/95 backdrop-blur-md border-b border-cream-300 px-4 sm:px-6 md:px-8 py-3 flex items-center justify-between transition-all duration-300">
    <div class="flex items-center gap-3 sm:gap-6 flex-1 min-w-0">
        <a href="{% url 'expansio_dashboard' %}" class="text-lg sm:text-xl font-bold tracking-tight text-earth-900 md:hidden hover:text-terra-500 transition-colors flex items-center gap-2 shrink-0">
            <div class="w-8 h-8 rounded-xl bg-cream-50 flex items-center justify-center shadow-sm border border-cream-300 flex-shrink-0 overflow-hidden p-0.5">
                <img src="{% static 'img/favicon.png' %}" alt="Expansio" class="w-full h-full object-contain rounded-lg">
            </div>
            <span>Expansio</span>
        </a>

        <!-- Desktop Search Bar -->
        <form action="{% url 'expansio_transactions' %}" method="GET" class="hidden md:flex items-center bg-cream-50 hover:bg-cream-200/60 border border-cream-300 focus-within:border-terra-500 focus-within:ring-2 focus-within:ring-terra-500/20 focus-within:bg-cream-50 transition-all px-4 py-2 rounded-2xl w-64 lg:w-80 shadow-sm">
            <span class="material-symbols-outlined text-cream-500 text-sm mr-2.5 shrink-0">search</span>
            <input name="q" value="{{ request.GET.q|default:'' }}" class="bg-transparent border-none focus:ring-0 text-sm w-full font-sans text-earth-900 placeholder-cream-500 p-0" placeholder="Search transactions, categories..." type="text"/>
            {% if request.GET.q %}
            <a href="{% url 'expansio_transactions' %}" class="flex items-center justify-center p-1 hover:bg-cream-200 rounded-lg transition-colors group shrink-0">
                <span class="material-symbols-outlined text-cream-500 text-[18px] group-hover:text-warmrose-500">close</span>
            </a>
            {% endif %}
        </form>

        <!-- Mobile Search Container -->
        <div id="mobile-search-bar" class="hidden md:hidden w-full absolute inset-x-0 top-0 bg-cream-100 p-3 px-4 border-b border-cream-300 shadow-md z-50 flex items-center gap-2">
            <form action="{% url 'expansio_transactions' %}" method="GET" class="flex items-center bg-cream-50 border border-cream-300 focus-within:border-terra-500 focus-within:ring-2 focus-within:ring-terra-500/20 px-3.5 py-2 rounded-xl flex-1 shadow-sm">
                <span class="material-symbols-outlined text-cream-500 text-sm mr-2">search</span>
                <input name="q" value="{{ request.GET.q|default:'' }}" class="bg-transparent border-none focus:ring-0 text-sm w-full font-sans text-earth-900 placeholder-cream-500 p-0" placeholder="Search ledger..." type="text"/>
                {% if request.GET.q %}
                <a href="{% url 'expansio_transactions' %}" class="flex items-center justify-center p-1 hover:bg-cream-200 rounded-lg transition-colors">
                    <span class="material-symbols-outlined text-cream-500 text-[16px]">close</span>
                </a>
                {% endif %}
            </form>
            <button type="button" onclick="document.getElementById('mobile-search-bar').classList.add('hidden')" class="p-2 text-earth-600 hover:text-earth-900 rounded-xl bg-cream-200 text-xs font-bold">
                Cancel
            </button>
        </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Mobile Search Trigger -->
        <button type="button" onclick="document.getElementById('mobile-search-bar').classList.toggle('hidden')" class="md:hidden p-2 text-earth-600 hover:text-earth-900 hover:bg-cream-200 rounded-xl transition-all active:scale-95 flex items-center justify-center min-w-[36px] min-h-[36px]" title="Search">
            <span class="material-symbols-outlined text-[20px]">search</span>
        </button>

        <form method="post" action="{% url 'expansio_logout' %}" class="md:hidden">
            {% csrf_token %}
            <button type="submit" class="flex items-center justify-center p-2 text-earth-600 hover:text-warmrose-600 hover:bg-warmrose-50 rounded-xl transition-all active:scale-95 font-bold text-sm bg-cream-50 border border-cream-300 shadow-sm min-w-[36px] min-h-[36px]" title="Log out">
                <span class="material-symbols-outlined text-[18px]">logout</span>
            </button>
        </form>

        <div class="w-px h-6 bg-cream-300 mx-0.5 hidden sm:block"></div>

        <a href="{% url 'expansio_profile' %}" class="flex items-center gap-2.5 sm:gap-3 hover:bg-cream-200/80 p-1 sm:p-1.5 sm:pr-3.5 rounded-2xl transition-all border border-transparent hover:border-cream-300 cursor-pointer group shrink-0">
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-terra-500 to-golden-500 flex items-center justify-center text-white font-bold text-xs sm:text-sm shadow-sm shrink-0">
                {{ user.first_name|default:user.username|make_list|first|upper }}
            </div>
            <div class="hidden sm:block text-left">
                <p class="text-xs sm:text-sm font-bold text-earth-900 leading-tight mb-0.5 group-hover:text-terra-500 transition-colors truncate max-w-[120px]">{{ user.first_name|default:user.username }}</p>
                <p class="text-[10px] text-earth-600 font-medium">Verified User</p>
            </div>
        </a>
    </div>
</header>
