{% load static %}

<header class="w-full sticky top-0 z-40 bg-cream-100/90 backdrop-blur-md border-b border-cream-300 px-6 md:px-8 py-3.5 flex items-center justify-between transition-all duration-300">
    <div class="flex items-center gap-6">
        <a href="{% url 'expansio_dashboard' %}" class="text-xl font-bold tracking-tight text-earth-900 md:hidden hover:text-terra-500 transition-colors flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-cream-50 flex items-center justify-center shadow-sm border border-cream-300 flex-shrink-0 overflow-hidden p-0.5">
                <img src="{% static 'img/favicon.png' %}" alt="Expansio" class="w-full h-full object-contain rounded-lg">
            </div>
            Expansio
        </a>
        <form action="{% url 'expansio_transactions' %}" method="GET" class="hidden md:flex items-center bg-cream-50 hover:bg-cream-200/60 border border-cream-300 focus-within:border-terra-500 focus-within:ring-2 focus-within:ring-terra-500/20 focus-within:bg-cream-50 transition-all px-4 py-2 rounded-2xl w-88 shadow-sm">
            <span class="material-symbols-outlined text-cream-500 text-sm mr-3">search</span>
            <input name="q" value="{{ request.GET.q|default:'' }}" class="bg-transparent border-none focus:ring-0 text-sm w-full font-sans text-earth-900 placeholder-cream-500 p-0" placeholder="Search transactions, categories..." type="text"/>
            {% if request.GET.q %}
            <a href="{% url 'expansio_transactions' %}" class="flex items-center justify-center p-1 hover:bg-cream-200 rounded-lg transition-colors group">
                <span class="material-symbols-outlined text-cream-500 text-[18px] group-hover:text-warmrose-500">close</span>
            </a>
            {% endif %}
        </form>
    </div>
    <div class="flex items-center gap-3">
        <form method="post" action="{% url 'expansio_logout' %}" class="md:hidden">
            {% csrf_token %}
            <button type="submit" class="flex items-center gap-2 p-2 text-earth-600 hover:text-warmrose-600 hover:bg-warmrose-50 rounded-xl transition-all active:scale-95 font-bold text-sm bg-cream-50 border border-cream-300 shadow-sm">
                <span class="material-symbols-outlined text-[20px]">logout</span>
            </button>
        </form>
        <div class="w-px h-7 bg-cream-300 mx-1 hidden sm:block"></div>
        <a href="{% url 'expansio_profile' %}" class="flex items-center gap-3 hover:bg-cream-200/80 p-1.5 pr-3.5 rounded-2xl transition-all border border-transparent hover:border-cream-300 cursor-pointer group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-terra-500 to-golden-500 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                {{ user.first_name|default:user.username|make_list|first|upper }}
            </div>
            <div class="hidden sm:block text-left">
                <p class="text-sm font-bold text-earth-900 leading-tight mb-0.5 group-hover:text-terra-500 transition-colors">{{ user.first_name|default:user.username }}</p>
                <p class="text-[11px] text-earth-600 font-medium">Verified User</p>
            </div>
        </a>
    </div>
</header>
